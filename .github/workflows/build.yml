name: Build watch APK

on:
  push:
    branches:
      - '**'
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Set ANDROID_HOME
        run: echo "ANDROID_HOME=/usr/local/lib/android/sdk" >> $GITHUB_ENV

      - name: Work out the version
        run: echo "VERSION=$(grep '^claudewatch.version=' gradle.properties | cut -d= -f2).${GITHUB_RUN_NUMBER}" >> $GITHUB_ENV

      - name: Test and build
        run: ./gradlew :core:test :app:assembleDebug --no-daemon

      - name: Name the APK after the version
        run: cp app/build/outputs/apk/debug/app-debug.apk "ClaudeWatch-$VERSION.apk"

      - name: Inspect APK
        run: |
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$BT/aapt2" dump badging "ClaudeWatch-$VERSION.apk" | grep -E "^(package|sdkVersion|minSdkVersion|targetSdkVersion|uses-feature|application-debuggable|testOnly)" || true
          "$BT/apksigner" verify --verbose --print-certs "ClaudeWatch-$VERSION.apk" | grep -E "^Verified using v2|certificate SHA-256" || true

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: ClaudeWatch-${{ env.VERSION }}
          path: ClaudeWatch-${{ env.VERSION }}.apk
          retention-days: 14
