[versions]
agp = "9.4.1"
kotlin = "2.4.20"
coroutines = "1.11.0"
wear = "1.4.0"
healthServices = "1.1.0"
listenableFuture = "1.0"
tiles = "1.6.2"
protolayout = "1.4.2"
concurrentFutures = "1.3.0"

[libraries]
kotlin-gradle-plugin = { module = "org.jetbrains.kotlin:kotlin-gradle-plugin", version.ref = "kotlin" }
kotlinx-coroutines-android = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-android", version.ref = "coroutines" }
androidx-wear = { module = "androidx.wear:wear", version.ref = "wear" }
androidx-health-services = { module = "androidx.health:health-services-client", version.ref = "healthServices" }
# Health Services and Tiles return ListenableFuture without exposing it; this is the class alone, not all of Guava.
guava-listenablefuture = { module = "com.google.guava:listenablefuture", version.ref = "listenableFuture" }
androidx-wear-tiles = { module = "androidx.wear.tiles:tiles", version.ref = "tiles" }
androidx-wear-protolayout = { module = "androidx.wear.protolayout:protolayout", version.ref = "protolayout" }
androidx-concurrent-futures = { module = "androidx.concurrent:concurrent-futures", version.ref = "concurrentFutures" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
